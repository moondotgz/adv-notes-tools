<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit converter</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --accent:#2d4bd8; --field:#f2f3f7; --good:#2e9e5b; --warn:#e0a020; --bad:#d64545; }
  [data-theme="dark"] { --bg:#1b1c20; --fg:#e8e8ec; --muted:#9a9aa5; --accent:#b3c3ff; --field:#2a2c33; --good:#5fd08a; --warn:#f0c050; --bad:#ff7b7b; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif; max-width:520px; margin-inline:auto; }
  h2 { font-size:18px; margin:0 0 10px; }
  input, select, textarea, button { font:inherit; padding:10px; border-radius:10px; border:0; background:var(--field); color:var(--fg); }
  input, textarea, select { width:100%; }
  textarea { resize:vertical; min-height:80px; }
  button { background:var(--accent); color:var(--bg); cursor:pointer; }
  button.ghost { background:var(--field); color:var(--fg); }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row > * { flex:1; min-width:0; }
  .row > .fit { flex:0 0 auto; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button { flex:1; background:var(--field); color:var(--fg); padding:8px 4px; font-size:14px; }
  .tabs button.on { background:var(--accent); color:var(--bg); }
  .card { background:var(--field); border-radius:14px; padding:14px; margin:8px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .hide { display:none !important; }
  .err { color:var(--bad); font-size:14px; }
  .pre { white-space:pre-wrap; }

</style>
</head>
<body>

<div class="row" id="cats" style="flex-wrap:wrap"></div>
<div class="card">
  <div class="row"><input id="a" inputmode="decimal"><select id="ua"></select></div>
  <div class="row"><button class="ghost fit" id="swap" title="Swap">⇅</button><span></span></div>
  <div class="row"><input id="b" inputmode="decimal"><select id="ub"></select></div>
</div>
<div class="row"><button id="w">Write on page</button></div>
<div id="all" class="card"></div>

<script src="../lib/advnotes.js"></script>
<script>
(() => {

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A = window.AdvNotes;
const db = {
  get(k, d) {
    try {
      if (A && A.storage && A.storage.getJSON) return A.storage.getJSON(k, d);
      const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v);
    } catch { return d; }
  },
  set(k, v) {
    try {
      if (A && A.storage && A.storage.setJSON) return A.storage.setJSON(k, v);
      localStorage.setItem(k, JSON.stringify(v));
    } catch {}
  }
};
function toast(m) { try { A && A.toast ? A.toast(m) : null; } catch {} }
function insert(t) {
  if (A && A.insertText) { A.insertText(t); toast('Written on your page'); } else alert(t);
}
// Ask the AI; resolves with the answer text. src: 'page' | 'selection' | undefined
async function ask(prompt, opts = {}) {
  if (!A || !A.ask) throw new Error('AI is not available here.');
  const r = await A.ask(prompt, opts);
  return typeof r === 'string' ? r : (r && r.text) || '';
}
// Pull the first JSON array/object out of an AI answer, tolerating code fences and chatter.
function parseJSON(t) {
  t = t.replace(/```(?:json)?/gi, '');
  const bad = () => new Error('The AI did not return structured data. It said: "' + t.trim().slice(0, 160) + (t.trim().length > 160 ? '…' : '') + '"');
  const a = t.search(/[\[{]/); if (a < 0) throw bad();
  const open = t[a], close = open === '[' ? ']' : '}';
  const b = t.lastIndexOf(close);
  try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw bad(); }
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayNum = s => Math.round(Date.parse(s + 'T00:00:00Z') / 864e5);
function tabs(ids, onchange) {
  const bs = [...document.querySelectorAll('.tabs button')];
  bs.forEach(b => b.onclick = () => {
    bs.forEach(x => x.classList.toggle('on', x === b));
    ids.forEach(i => $(i).classList.toggle('hide', i !== b.dataset.t));
    onchange && onchange(b.dataset.t);
  });
  bs[0].click();
}

// Places a canvas on the page as a picture (app 1.5.0+).
function placeImage(cv) {
  if (A && A.insertImage) { A.insertImage(cv.toDataURL('image/png')) ? toast('Placed on your page — move or resize it with the lasso') : toast('Could not place the picture'); }
  else toast('Update Adv Notes to 1.5.0 or newer to place pictures on the page');
}
// Each unit: [name, factor to the base unit]. Temperature is handled separately.
const U = {
  Length: [['m',1],['km',1e3],['cm',1e-2],['mm',1e-3],['µm',1e-6],['nm',1e-9],['pm',1e-12],['Å',1e-10],['in',0.0254],['ft',0.3048],['yd',0.9144],['mi',1609.344]],
  Mass: [['kg',1],['g',1e-3],['mg',1e-6],['µg',1e-9],['t',1e3],['u (Da)',1.66053906660e-27],['lb',0.45359237],['oz',0.028349523125]],
  Volume: [['L (dm³)',1],['mL (cm³)',1e-3],['µL',1e-6],['m³',1e3],['gal (US)',3.785411784],['qt (US)',0.946352946],['fl oz (US)',0.0295735295625]],
  Pressure: [['Pa',1],['kPa',1e3],['MPa',1e6],['hPa',100],['bar',1e5],['atm',101325],['mmHg',133.322387415],['Torr',101325/760],['psi',6894.757293168]],
  Energy: [['J',1],['kJ',1e3],['MJ',1e6],['cal',4.184],['kcal',4184],['eV',1.602176634e-19],['Wh',3600],['kWh',3.6e6],['kJ/mol → eV/particle',1e3/6.02214076e23]],
  Temperature: [['°C'],['K'],['°F']],
  Amount: [['mol',1],['mmol',1e-3],['µmol',1e-6],['kmol',1e3],['particles',1/6.02214076e23]],
  Concentration: [['mol/L (M)',1],['mmol/L (mM)',1e-3],['µmol/L (µM)',1e-6],['mol/m³',1e-3]],
  Time: [['s',1],['ms',1e-3],['µs',1e-6],['min',60],['h',3600],['day',86400],['year',31557600]],
  Speed: [['m/s',1],['km/h',1/3.6],['mph',0.44704],['knot',1852/3600]],
  Area: [['m²',1],['cm²',1e-4],['mm²',1e-6],['km²',1e6],['ha',1e4],['acre',4046.8564224],['ft²',0.09290304]],
};
let cat = db.get('cat', 'Pressure');
const toK = (v, u) => u === 'K' ? v : u === '°C' ? v + 273.15 : (v - 32) * 5 / 9 + 273.15;
const fromK = (k, u) => u === 'K' ? k : u === '°C' ? k - 273.15 : (k - 273.15) * 9 / 5 + 32;
const num = s => { s = String(s).trim().replace(',', '.').replace(/\s*[x×]\s*10\^?/i, 'e'); return s === '' ? NaN : Number(s); };
const show = x => !isFinite(x) ? '' : (Math.abs(x) >= 1e7 || (x !== 0 && Math.abs(x) < 1e-4)) ? x.toExponential(5).replace(/\.?0+e/, 'e') : String(+x.toPrecision(8));
function conv(v, from, to) {
  if (cat === 'Temperature') return fromK(toK(v, from), to);
  const f = U[cat].find(u => u[0] === from)[1], t = U[cat].find(u => u[0] === to)[1];
  return v * f / t;
}
function renderCats() {
  $('cats').innerHTML = Object.keys(U).map(c => `<button class="${c === cat ? '' : 'ghost'} fit" data-c="${c}" style="padding:6px 12px;font-size:14px">${c}</button>`).join('');
  $('cats').querySelectorAll('button').forEach(b => b.onclick = () => { cat = b.dataset.c; db.set('cat', cat); setup(); });
}
function setup() {
  renderCats();
  const opts = U[cat].map(u => `<option>${u[0]}</option>`).join('');
  $('ua').innerHTML = $('ub').innerHTML = opts;
  const saved = db.get('pair:' + cat, null);
  $('ua').value = saved ? saved[0] : U[cat][0][0]; $('ub').value = saved ? saved[1] : U[cat][1][0];
  if (!$('a').value) $('a').value = '1';
  update('a');
}
function update(from) {
  db.set('pair:' + cat, [$('ua').value, $('ub').value]);
  if (from === 'a') $('b').value = show(conv(num($('a').value), $('ua').value, $('ub').value));
  else $('a').value = show(conv(num($('b').value), $('ub').value, $('ua').value));
  const v = num($('a').value), u = $('ua').value;
  $('all').innerHTML = isFinite(v) ? `<div class="muted">${esc($('a').value)} ${esc(u)} is</div>` + U[cat].filter(x => x[0] !== u).map(x => `<div>${show(conv(v, u, x[0]))} ${esc(x[0])}</div>`).join('') : '';
}
$('a').oninput = () => update('a'); $('b').oninput = () => update('b');
$('ua').onchange = () => update('a'); $('ub').onchange = () => update('a');
$('swap').onclick = () => { const t = $('ua').value; $('ua').value = $('ub').value; $('ub').value = t; update('a'); };
$('w').onclick = () => insert(`${$('a').value} ${$('ua').value} = ${$('b').value} ${$('ub').value}`);
setup();

})();
</script>
</body>
</html>
