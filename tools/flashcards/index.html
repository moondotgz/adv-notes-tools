<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --accent:#2d4bd8; --field:#f2f3f7; --good:#2e9e5b; --warn:#e0a020; --bad:#d64545; }
  [data-theme="dark"] { --bg:#1b1c20; --fg:#e8e8ec; --muted:#9a9aa5; --accent:#b3c3ff; --field:#2a2c33; --good:#5fd08a; --warn:#f0c050; --bad:#ff7b7b; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif; max-width:520px; margin-inline:auto; }
  h2 { font-size:18px; margin:0 0 10px; }
  input, select, textarea, button { font:inherit; padding:10px; border-radius:10px; border:0; background:var(--field); color:var(--fg); }
  input, textarea, select { width:100%; }
  textarea { resize:vertical; min-height:80px; }
  button { background:var(--accent); color:var(--bg); cursor:pointer; }
  button.ghost { background:var(--field); color:var(--fg); }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row > * { flex:1; min-width:0; }
  .row > .fit { flex:0 0 auto; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button { flex:1; background:var(--field); color:var(--fg); padding:8px 4px; font-size:14px; }
  .tabs button.on { background:var(--accent); color:var(--bg); }
  .card { background:var(--field); border-radius:14px; padding:14px; margin:8px 0; }
  .muted { color:var(--muted); font-size:14px; }
  .hide { display:none !important; }
  .err { color:var(--bad); font-size:14px; }
  .pre { white-space:pre-wrap; }
</style>
</head>
<body>

<div class="tabs"><button data-t="review">Review</button><button data-t="add">Add</button><button data-t="list">Cards</button></div>

<div id="review">
  <div class="muted" id="counts"></div>
  <div class="card" id="face" style="min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;cursor:pointer"></div>
  <div id="grades" class="row hide">
    <button class="ghost" data-g="0" style="color:var(--bad)">Again</button>
    <button class="ghost" data-g="1">Hard</button>
    <button class="ghost" data-g="2" style="color:var(--good)">Good</button>
    <button class="ghost" data-g="3" style="color:var(--accent)">Easy</button>
  </div>
  <div id="showrow" class="row"><button id="show">Show answer</button></div>
</div>

<div id="add" class="hide">
  <h2>New card</h2>
  <textarea id="q" placeholder="Question / front" rows="2"></textarea>
  <textarea id="a" placeholder="Answer / back" rows="2" style="margin-top:8px"></textarea>
  <div class="row"><button id="addBtn">Add card</button></div>
  <h2 style="margin-top:22px">Generate with AI</h2>
  <p class="muted">Reads your current page (or lasso selection) and writes cards from it.</p>
  <div class="row">
    <select id="src"><option value="selection">Lasso selection</option><option value="page">Visible page</option></select>
    <input id="n" type="number" min="1" max="20" value="8" class="fit" style="width:80px">
  </div>
  <div class="row"><button id="gen">Generate cards</button></div>
  <div id="genout" class="muted"></div>
</div>

<div id="list" class="hide">
  <input id="find" placeholder="Search cards">
  <div id="cards"></div>
  <div class="row"><button class="ghost" id="reset">Reset all progress</button></div>
</div>

<script src="../lib/advnotes.js"></script>
<script>
(() => {

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A = window.AdvNotes;
const db = {
  get(k, d) {
    try {
      if (A && A.storage && A.storage.getJSON) return A.storage.getJSON(k, d);
      const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v);
    } catch { return d; }
  },
  set(k, v) {
    try {
      if (A && A.storage && A.storage.setJSON) return A.storage.setJSON(k, v);
      localStorage.setItem(k, JSON.stringify(v));
    } catch {}
  }
};
function toast(m) { try { A && A.toast ? A.toast(m) : null; } catch {} }
function insert(t) {
  if (A && A.insertText) { A.insertText(t); toast('Written on your page'); } else alert(t);
}
// Ask the AI; resolves with the answer text. src: 'page' | 'selection' | undefined
async function ask(prompt, opts = {}) {
  if (!A || !A.ask) throw new Error('AI is not available here.');
  const r = await A.ask(prompt, opts);
  return typeof r === 'string' ? r : (r && r.text) || '';
}
// Pull the first JSON array/object out of an AI answer, tolerating code fences and chatter.
function parseJSON(t) {
  t = t.replace(/```(?:json)?/gi, '');
  const a = t.search(/[\[{]/); if (a < 0) throw new Error('The AI did not return structured data. Try again.');
  const open = t[a], close = open === '[' ? ']' : '}';
  const b = t.lastIndexOf(close);
  return JSON.parse(t.slice(a, b + 1));
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayNum = s => Math.round(Date.parse(s + 'T00:00:00Z') / 864e5);
function tabs(ids, onchange) {
  const bs = [...document.querySelectorAll('.tabs button')];
  bs.forEach(b => b.onclick = () => {
    bs.forEach(x => x.classList.toggle('on', x === b));
    ids.forEach(i => $(i).classList.toggle('hide', i !== b.dataset.t));
    onchange && onchange(b.dataset.t);
  });
  bs[0].click();
}

let cards = db.get('cards', []);
let cur = null, shown = false;
const save = () => db.set('cards', cards);
const DAY = 864e5;

function due() { const now = Date.now(); return cards.filter(c => c.due <= now).sort((a, b) => a.due - b.due); }
function next() {
  const d = due(); cur = d[0] || null; shown = false; renderReview();
}
function renderReview() {
  const d = due(), fresh = cards.filter(c => !c.reps).length;
  $('counts').textContent = `${d.length} due · ${cards.length} total · ${fresh} new`;
  if (!cards.length) { $('face').textContent = 'No cards yet. Add some in the Add tab.'; }
  else if (!cur) { $('face').textContent = '🎉 All caught up!'; }
  else { $('face').textContent = shown ? cur.a : cur.q; $('face').style.color = shown ? 'var(--accent)' : 'var(--fg)'; }
  $('showrow').classList.toggle('hide', !cur || shown);
  $('grades').classList.toggle('hide', !cur || !shown);
  if (cur && shown) {
    const labels = [0,1,2,3].map(g => fmt(schedule(cur, g).interval));
    document.querySelectorAll('#grades button').forEach((b, i) => b.title = labels[i]);
    document.querySelectorAll('#grades button').forEach((b, i) => b.textContent = ['Again','Hard','Good','Easy'][i] + ' · ' + labels[i]);
  }
}
const fmt = d => d < 1 ? '10m' : d < 30 ? Math.round(d) + 'd' : d < 365 ? Math.round(d / 30) + 'mo' : (d / 365).toFixed(1) + 'y';

// SM-2 style scheduling. grade: 0 again, 1 hard, 2 good, 3 easy. Interval in days.
function schedule(c, g) {
  let ease = c.ease || 2.5, reps = c.reps || 0, iv = c.interval || 0;
  if (g === 0) { return { ease: Math.max(1.3, ease - 0.2), reps: 0, interval: 0 }; }
  ease = Math.max(1.3, ease + [0, -0.15, 0, 0.15][g]);
  reps += 1;
  if (reps === 1) iv = g === 3 ? 4 : 1;
  else if (reps === 2) iv = g === 1 ? 3 : g === 3 ? 8 : 6;
  else iv = iv * ease * (g === 1 ? 0.8 : g === 3 ? 1.3 : 1);
  return { ease, reps, interval: Math.max(1, Math.round(iv)) };
}
document.querySelectorAll('#grades button').forEach(b => b.onclick = () => {
  const g = +b.dataset.g, r = schedule(cur, g);
  Object.assign(cur, r);
  cur.due = g === 0 ? Date.now() + 10 * 60 * 1000 : Date.now() + r.interval * DAY;
  save(); next();
});
$('show').onclick = $('face').onclick = () => { if (cur && !shown) { shown = true; renderReview(); } };

function addCard(q, a) { cards.push({ id: Date.now() + Math.random(), q, a, ease: 2.5, reps: 0, interval: 0, due: 0 }); }
$('addBtn').onclick = () => {
  const q = $('q').value.trim(), a = $('a').value.trim();
  if (!q || !a) return;
  addCard(q, a); save(); $('q').value = $('a').value = ''; $('q').focus(); toast('Card added');
};
$('gen').onclick = async () => {
  const btn = $('gen'), out = $('genout'); btn.disabled = true; out.className = 'muted'; out.textContent = 'Reading and thinking…';
  try {
    const n = Math.min(20, Math.max(1, +$('n').value || 8));
    const t = await ask(`Create up to ${n} concise study flashcards from the content of this image. Cover the key facts and concepts only. Reply with ONLY a JSON array like [{"q":"question","a":"short answer"}].`, { image: $('src').value });
    const arr = parseJSON(t).filter(x => x && x.q && x.a);
    if (!arr.length) throw new Error('No cards were generated.');
    arr.forEach(x => addCard(String(x.q), String(x.a))); save();
    out.textContent = `Added ${arr.length} cards.`;
  } catch (e) { out.className = 'err'; out.textContent = e.message; }
  btn.disabled = false;
};

function renderList() {
  const f = $('find').value.toLowerCase();
  $('cards').innerHTML = cards.filter(c => (c.q + c.a).toLowerCase().includes(f)).map(c =>
    `<div class="card"><div>${esc(c.q)}</div><div class="muted">${esc(c.a)}</div>
     <div class="row"><span class="muted">${c.reps ? 'next in ' + fmt(Math.max(0, (c.due - Date.now()) / DAY)) : 'new'}</span>
     <button class="ghost fit" data-del="${c.id}">Delete</button></div></div>`).join('') || '<p class="muted">Nothing here.</p>';
  $('cards').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { cards = cards.filter(c => String(c.id) !== b.dataset.del); save(); renderList(); });
}
$('find').oninput = renderList;
$('reset').onclick = () => { if (confirm('Make every card new again?')) { cards.forEach(c => Object.assign(c, { ease: 2.5, reps: 0, interval: 0, due: 0 })); save(); renderList(); } };

tabs(['review', 'add', 'list'], t => { if (t === 'review') next(); if (t === 'list') renderList(); });

})();
</script>
</body>
</html>
