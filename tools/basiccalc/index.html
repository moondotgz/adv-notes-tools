<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic calculator</title>
<style>
  /* Colours come from the app (Material You, set as --an-* by advnotes.js); the fallbacks are the app's own palette. */
  :root {
    --bg: var(--an-background, #F5F2FA); --fg: var(--an-onSurface, #1C1B1F); --muted: var(--an-onSurfaceVariant, #49454F);
    --accent: var(--an-primary, #3557D6); --on-accent: var(--an-onPrimary, #FFFFFF);
    --tonal: var(--an-secondaryContainer, #E0E0F9); --on-tonal: var(--an-onSecondaryContainer, #1D192B);
    --field: var(--an-surfaceContainerHighest, #E3E1E9); --card: var(--an-surfaceContainerHigh, #E9E7EF);
    --line: var(--an-outlineVariant, #CAC4D0); --outline: var(--an-outline, #79747E);
    --good: var(--an-tertiary, #0F8B6F); --warn:#C98A00; --bad: var(--an-error, #B3261E);
  }
  [data-theme="dark"] {
    --bg: var(--an-background, #1E1F25); --fg: var(--an-onSurface, #E6E1E5); --muted: var(--an-onSurfaceVariant, #CAC4D0);
    --accent: var(--an-primary, #B8C4FF); --on-accent: var(--an-onPrimary, #1B2C70);
    --tonal: var(--an-secondaryContainer, #444659); --on-tonal: var(--an-onSecondaryContainer, #E8DEF8);
    --field: var(--an-surfaceContainerHighest, #34343A); --card: var(--an-surfaceContainerHigh, #292A2F);
    --line: var(--an-outlineVariant, #49454F); --outline: var(--an-outline, #938F99);
    --good: var(--an-tertiary, #7FD8BF); --warn:#F0C050; --bad: var(--an-error, #F2B8B5);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 Roboto, system-ui, sans-serif; max-width:560px; margin-inline:auto; accent-color:var(--accent); }
  h2 { font-size:16px; font-weight:600; margin:0 0 10px; }
  input, select, textarea, button { font:inherit; color:var(--fg); }
  input, select, textarea { width:100%; padding:12px 14px; border-radius:12px; border:1px solid transparent; background:var(--field); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  input[type=checkbox], input[type=radio] { width:18px; height:18px; padding:0; }
  input[type=range] { background:none; padding:0; border:0; }
  ::placeholder { color:var(--muted); opacity:.8; }
  textarea { resize:vertical; min-height:84px; }
  button { min-height:40px; padding:8px 20px; border:0; border-radius:20px; background:var(--accent); color:var(--on-accent);
           font-size:14px; font-weight:600; letter-spacing:.1px; cursor:pointer; transition:filter .15s, opacity .15s; }
  button:active { filter:brightness(.92); }
  button.ghost { background:var(--tonal); color:var(--on-tonal); }
  button:disabled { opacity:.38; cursor:default; }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row > * { flex:1; min-width:0; }
  .row > .fit { flex:0 0 auto; }
  .row button.fit { padding:6px 14px; min-height:32px; border-radius:8px; }
  .tabs { display:flex; margin-bottom:14px; border:1px solid var(--outline); border-radius:20px; overflow:hidden; }
  .tabs button { flex:1; border-radius:0; background:transparent; color:var(--fg); padding:8px 4px; min-height:40px; }
  .tabs button + button { border-left:1px solid var(--outline); }
  .tabs button.on { background:var(--tonal); color:var(--on-tonal); }
  .card { background:var(--card); border-radius:18px; padding:16px; margin:10px 0; }
  .card input, .card select, .card textarea { background:var(--bg); }
  .muted { color:var(--muted); font-size:14px; }
  .hide { display:none !important; }
  .err { color:var(--bad); font-size:14px; }
  .pre { white-space:pre-wrap; }
  body { max-width:440px; }
  .screen { background:var(--card); border-radius:24px; padding:14px 18px 10px; margin-bottom:12px; text-align:right; }
  .expr { min-height:22px; color:var(--muted); font-size:16px; overflow-wrap:anywhere; }
  .disp { font-size:44px; font-weight:500; line-height:1.15; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
  .mem { min-height:18px; font-size:13px; color:var(--muted); text-align:left; }
  .keys { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .k { min-height:62px; border-radius:20px; font-size:24px; font-weight:500; background:var(--field); color:var(--fg); }
  .k.fn { background:var(--tonal); color:var(--on-tonal); font-size:19px; }
  .k.op { background:var(--tonal); color:var(--on-tonal); font-size:28px; }
  .k.eq { background:var(--accent); color:var(--on-accent); font-size:28px; }
  .k.on { outline:3px solid var(--accent); outline-offset:-3px; }
  .tape { margin-top:8px; font-variant-numeric:tabular-nums; }
  .tape div { display:flex; justify-content:space-between; gap:12px; padding:6px 4px; border-bottom:1px solid var(--line); font-size:15px; cursor:pointer; }
  .tape div span:first-child { color:var(--muted); }
</style>
</head>
<body>

<div class="screen">
  <div id="expr" class="expr" translate="no"></div>
  <div id="disp" class="disp" translate="no">0</div>
  <div id="mem" class="mem" translate="no"></div>
</div>
<div class="keys">
  <button class="k fn" data-k="mc" title="Memory clear">MC</button>
  <button class="k fn" data-k="mr" title="Memory recall">MR</button>
  <button class="k fn" data-k="m-" title="Memory minus">M−</button>
  <button class="k fn" data-k="m+" title="Memory plus">M+</button>
  <button class="k fn" id="clr" data-k="c" title="Clear">AC</button>
  <button class="k fn" data-k="neg" title="Change sign">±</button>
  <button class="k fn" data-k="%" title="Percent">%</button>
  <button class="k op" data-k="/" title="Divide">÷</button>
  <button class="k" data-k="7">7</button><button class="k" data-k="8">8</button><button class="k" data-k="9">9</button>
  <button class="k op" data-k="*" title="Multiply">×</button>
  <button class="k" data-k="4">4</button><button class="k" data-k="5">5</button><button class="k" data-k="6">6</button>
  <button class="k op" data-k="-" title="Subtract">−</button>
  <button class="k" data-k="1">1</button><button class="k" data-k="2">2</button><button class="k" data-k="3">3</button>
  <button class="k op" data-k="+" title="Add">+</button>
  <button class="k fn" data-k="back" title="Backspace">⌫</button>
  <button class="k" data-k="0">0</button>
  <button class="k" data-k="." id="dot" title="Decimal point">.</button>
  <button class="k eq" data-k="=" title="Equals">=</button>
</div>
<div class="row"><button id="write">Write on page</button><button class="ghost fit" id="clearTape">Clear tape</button></div>
<div id="tape" class="tape"></div>

<script src="../lib/advnotes.js"></script>
<script>
(() => {

const $ = id => document.getElementById(id);

const tr = (s, ...a) => (window.AdvNotes && window.AdvNotes.t) ? window.AdvNotes.t(s, ...a) : a.reduce((x, v, i) => x.split('{' + i + '}').join(String(v)), s);   // translate (i18n/<lang>.json)
const inLang = () => (window.AdvNotes && window.AdvNotes.lang && window.AdvNotes.lang !== 'en') ? ' Write all text in ' + window.AdvNotes.languageName + ' (language tag ' + window.AdvNotes.lang + ').' : '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A = window.AdvNotes;
const db = {
  get(k, d) {
    try {
      if (A && A.storage && A.storage.getJSON) return A.storage.getJSON(k, d);
      const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v);
    } catch { return d; }
  },
  set(k, v) {
    try {
      if (A && A.storage && A.storage.setJSON) return A.storage.setJSON(k, v);
      localStorage.setItem(k, JSON.stringify(v));
    } catch {}
  }
};
function toast(m) { try { A && A.toast ? A.toast(m) : null; } catch {} }
function insert(t) {
  if (A && A.insertText) { A.insertText(t); toast(tr('Written on your page')); } else alert(t);
}
// Ask the AI; resolves with the answer text. src: 'page' | 'selection' | undefined
async function ask(prompt, opts = {}) {
  if (!A || !A.ask) throw new Error(tr('AI is not available here.'));
  const r = await A.ask(prompt, opts);
  return typeof r === 'string' ? r : (r && r.text) || '';
}
// Pull the first JSON array/object out of an AI answer, tolerating code fences and chatter.
function parseJSON(t) {
  t = t.replace(/```(?:json)?/gi, '');
  const bad = () => new Error(tr('The AI did not return structured data. It said: "{0}"', t.trim().slice(0, 160) + (t.trim().length > 160 ? '…' : '')));
  const a = t.search(/[\[{]/); if (a < 0) throw bad();
  const open = t[a], close = open === '[' ? ']' : '}';
  const b = t.lastIndexOf(close);
  try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw bad(); }
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayNum = s => Math.round(Date.parse(s + 'T00:00:00Z') / 864e5);
function tabs(ids, onchange) {
  const bs = [...document.querySelectorAll('.tabs button')];
  bs.forEach(b => b.onclick = () => {
    bs.forEach(x => x.classList.toggle('on', x === b));
    ids.forEach(i => $(i).classList.toggle('hide', i !== b.dataset.t));
    onchange && onchange(b.dataset.t);
  });
  bs[0].click();
}

// A desk calculator: operations run left to right as you type them (2 + 3 × 4 = 20).
const LANG = (window.AdvNotes && window.AdvNotes.lang) || undefined;
const DEC = (1.1).toLocaleString(LANG).charAt(1) === ',' ? ',' : '.';
const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
let cur = '0', acc = null, op = null, fresh = true, line = '', mem = db.get('mem', 0), tape = db.get('tape', []), lastLine = '';
// Full precision is kept while calculating; only what is shown is rounded (0.1 + 0.2 shows 0.3, 1 ÷ 3 × 3 = 1).
const clean = x => Number.isFinite(x) ? +x.toPrecision(12) : x;
const show = x => {
  if (typeof x === 'string') { const [i, f] = x.split('.'); return Number(i || 0).toLocaleString(LANG).replace(/^-?0$/, x.startsWith('-') ? '-0' : '0') + (f !== undefined ? DEC + f : ''); }
  if (!Number.isFinite(x)) return tr('Error');
  x = clean(x);
  return Math.abs(x) >= 1e15 || (x !== 0 && Math.abs(x) < 1e-9) ? x.toExponential(8).replace(/\.?0+e/, 'e').replace('.', DEC) : x.toLocaleString(LANG, { maximumFractionDigits: 10 });
};
const apply = (a, o, b) => o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : b === 0 ? NaN : a / b;
function render() {
  $('disp').textContent = cur === 'NaN' ? tr('Error') : show(fresh || cur.includes('e') ? Number(cur) : cur);
  $('expr').textContent = line;
  $('mem').textContent = mem ? 'M = ' + show(mem) : '';
  $('clr').textContent = fresh && cur === '0' ? 'AC' : 'C';
  document.querySelectorAll('.op').forEach(b => b.classList.toggle('on', fresh && b.dataset.k === op));
  $('tape').innerHTML = tape.slice().reverse().map((t, i) => `<div data-i="${tape.length - 1 - i}"><span>${esc(t.e)}</span><b>${esc(t.r)}</b></div>`).join('');
  $('tape').querySelectorAll('div').forEach(d => d.onclick = () => { const t = tape[+d.dataset.i]; cur = String(t.v); fresh = true; render(); });
}
const num = () => Number(cur);
function setResult(v) { cur = Number.isFinite(v) ? String(v) : 'NaN'; }
function press(k) {
  if (cur === 'NaN' && k !== 'c') { cur = '0'; acc = null; op = null; line = ''; }
  if (/^[0-9]$/.test(k)) {
    if (fresh) { cur = k; fresh = false; } else if (cur.replace(/[-.]/g, '').length < 15) cur = cur === '0' ? k : cur === '-0' ? '-' + k : cur + k;
  } else if (k === '.') {
    if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.';
  } else if (k === 'back') {
    if (!fresh) { cur = cur.slice(0, -1); if (cur === '' || cur === '-') cur = '0'; }
  } else if (k === 'neg') {
    cur = cur.startsWith('-') ? cur.slice(1) : (cur === '0' ? '0' : '-' + cur); if (fresh && op === null) acc = null;
  } else if (k === 'c') {
    if (!fresh || cur !== '0') { cur = '0'; fresh = true; } else { acc = null; op = null; line = ''; }
  } else if (k === '%') {
    // a + b% → a + a·b/100;  a × b% → a × b/100;  b% alone → b/100
    const b = num(); setResult(acc !== null && (op === '+' || op === '-') ? acc * b / 100 : b / 100); fresh = true;
  } else if ('+-*/'.includes(k)) {
    if (op !== null && !fresh) { setResult(apply(acc, op, num())); }
    acc = num(); op = k; fresh = true; line = show(acc) + ' ' + SYM[k];
  } else if (k === '=') {
    if (op === null) return render();
    const b = num(), r = apply(acc, op, b);
    const e = show(acc) + ' ' + SYM[op] + ' ' + show(b);
    setResult(r); lastLine = e + ' = ' + show(r);
    tape.push({ e: e + ' =', r: show(r), v: r }); if (tape.length > 50) tape.shift(); db.set('tape', tape);
    line = e + ' ='; acc = null; op = null; fresh = true;
  } else if (k === 'mc') { mem = 0; db.set('mem', mem); }
  else if (k === 'mr') { cur = String(mem); fresh = true; }
  else if (k === 'm+' || k === 'm-') { mem = mem + (k === 'm+' ? 1 : -1) * num(); db.set('mem', mem); fresh = true; }
  render();
}
document.querySelectorAll('.k').forEach(b => b.onclick = () => press(b.dataset.k));
$('dot').textContent = DEC;
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const map = { Enter: '=', '=': '=', Backspace: 'back', Escape: 'c', Delete: 'c', ',': '.', x: '*', X: '*', '×': '*', '÷': '/' };
  const k = map[e.key] || e.key;
  if (/^[0-9]$/.test(k) || '+-*/.%='.includes(k) || ['back', 'c'].includes(k)) { e.preventDefault(); press(k); }
});
$('write').onclick = () => insert(lastLine || show(num()));
$('clearTape').onclick = () => { tape = []; db.set('tape', tape); render(); };
render();

})();
</script>
</body>
</html>
