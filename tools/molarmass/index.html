<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molar mass</title>
<style>
  /* Colours come from the app (Material You, set as --an-* by advnotes.js); the fallbacks are the app's own palette. */
  :root {
    --bg: var(--an-background, #F5F2FA); --fg: var(--an-onSurface, #1C1B1F); --muted: var(--an-onSurfaceVariant, #49454F);
    --accent: var(--an-primary, #3557D6); --on-accent: var(--an-onPrimary, #FFFFFF);
    --tonal: var(--an-secondaryContainer, #E0E0F9); --on-tonal: var(--an-onSecondaryContainer, #1D192B);
    --field: var(--an-surfaceContainerHighest, #E3E1E9); --card: var(--an-surfaceContainerHigh, #E9E7EF);
    --line: var(--an-outlineVariant, #CAC4D0); --outline: var(--an-outline, #79747E);
    --good: var(--an-tertiary, #0F8B6F); --warn:#C98A00; --bad: var(--an-error, #B3261E);
  }
  [data-theme="dark"] {
    --bg: var(--an-background, #1E1F25); --fg: var(--an-onSurface, #E6E1E5); --muted: var(--an-onSurfaceVariant, #CAC4D0);
    --accent: var(--an-primary, #B8C4FF); --on-accent: var(--an-onPrimary, #1B2C70);
    --tonal: var(--an-secondaryContainer, #444659); --on-tonal: var(--an-onSecondaryContainer, #E8DEF8);
    --field: var(--an-surfaceContainerHighest, #34343A); --card: var(--an-surfaceContainerHigh, #292A2F);
    --line: var(--an-outlineVariant, #49454F); --outline: var(--an-outline, #938F99);
    --good: var(--an-tertiary, #7FD8BF); --warn:#F0C050; --bad: var(--an-error, #F2B8B5);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 Roboto, system-ui, sans-serif; max-width:560px; margin-inline:auto; accent-color:var(--accent); }
  h2 { font-size:16px; font-weight:600; margin:0 0 10px; }
  input, select, textarea, button { font:inherit; color:var(--fg); }
  input, select, textarea { width:100%; padding:12px 14px; border-radius:12px; border:1px solid transparent; background:var(--field); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  input[type=checkbox], input[type=radio] { width:18px; height:18px; padding:0; }
  input[type=range] { background:none; padding:0; border:0; }
  ::placeholder { color:var(--muted); opacity:.8; }
  textarea { resize:vertical; min-height:84px; }
  button { min-height:40px; padding:8px 20px; border:0; border-radius:20px; background:var(--accent); color:var(--on-accent);
           font-size:14px; font-weight:600; letter-spacing:.1px; cursor:pointer; transition:filter .15s, opacity .15s; }
  button:active { filter:brightness(.92); }
  button.ghost { background:var(--tonal); color:var(--on-tonal); }
  button:disabled { opacity:.38; cursor:default; }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row > * { flex:1; min-width:0; }
  .row > .fit { flex:0 0 auto; }
  .row button.fit { padding:6px 14px; min-height:32px; border-radius:8px; }
  .tabs { display:flex; margin-bottom:14px; border:1px solid var(--outline); border-radius:20px; overflow:hidden; }
  .tabs button { flex:1; border-radius:0; background:transparent; color:var(--fg); padding:8px 4px; min-height:40px; }
  .tabs button + button { border-left:1px solid var(--outline); }
  .tabs button.on { background:var(--tonal); color:var(--on-tonal); }
  .card { background:var(--card); border-radius:18px; padding:16px; margin:10px 0; }
  .card input, .card select, .card textarea { background:var(--bg); }
  .muted { color:var(--muted); font-size:14px; }
  .hide { display:none !important; }
  .err { color:var(--bad); font-size:14px; }
  .pre { white-space:pre-wrap; }
  table.t { border-collapse:collapse; width:100%; font-size:14px; } table.t td, table.t th { padding:4px 6px; text-align:right; border-bottom:1px solid var(--bg); } table.t td:first-child, table.t th:first-child { text-align:left; }
  .lab { width:120px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>

<input id="f" placeholder="Formula, e.g. H2SO4, Ca(OH)2, CuSO4·5H2O" autocapitalize="off" autocomplete="off" spellcheck="false">
<div id="err" class="err"></div>
<div id="res" class="hide">
  <div class="card"><div class="muted" id="fname"></div><div style="font-size:24px;margin:4px 0" id="mm"></div>
    <table class="t" id="parts"></table></div>
  <div class="card"><div class="muted">Convert — type in any box</div>
    <div class="row"><label class="fit lab">Mass (g)</label><input id="g" inputmode="decimal"></div>
    <div class="row"><label class="fit lab">Amount (mol)</label><input id="n" inputmode="decimal"></div>
    <div class="row"><label class="fit lab">Particles</label><input id="N" inputmode="decimal"></div>
    <div class="row"><label class="fit lab">Gas at STP (L)</label><input id="V" inputmode="decimal"></div>
    <div class="muted">Particles use Nₐ = 6.022×10²³; gas volume uses 22.414 L/mol (0 °C, 1 atm).</div>
  </div>
  <div class="row"><button id="w">Write on page</button></div>
</div>

<script src="../lib/advnotes.js"></script>
<script>
(() => {

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A = window.AdvNotes;
const db = {
  get(k, d) {
    try {
      if (A && A.storage && A.storage.getJSON) return A.storage.getJSON(k, d);
      const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v);
    } catch { return d; }
  },
  set(k, v) {
    try {
      if (A && A.storage && A.storage.setJSON) return A.storage.setJSON(k, v);
      localStorage.setItem(k, JSON.stringify(v));
    } catch {}
  }
};
function toast(m) { try { A && A.toast ? A.toast(m) : null; } catch {} }
function insert(t) {
  if (A && A.insertText) { A.insertText(t); toast('Written on your page'); } else alert(t);
}
// Ask the AI; resolves with the answer text. src: 'page' | 'selection' | undefined
async function ask(prompt, opts = {}) {
  if (!A || !A.ask) throw new Error('AI is not available here.');
  const r = await A.ask(prompt, opts);
  return typeof r === 'string' ? r : (r && r.text) || '';
}
// Pull the first JSON array/object out of an AI answer, tolerating code fences and chatter.
function parseJSON(t) {
  t = t.replace(/```(?:json)?/gi, '');
  const bad = () => new Error('The AI did not return structured data. It said: "' + t.trim().slice(0, 160) + (t.trim().length > 160 ? '…' : '') + '"');
  const a = t.search(/[\[{]/); if (a < 0) throw bad();
  const open = t[a], close = open === '[' ? ']' : '}';
  const b = t.lastIndexOf(close);
  try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw bad(); }
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayNum = s => Math.round(Date.parse(s + 'T00:00:00Z') / 864e5);
function tabs(ids, onchange) {
  const bs = [...document.querySelectorAll('.tabs button')];
  bs.forEach(b => b.onclick = () => {
    bs.forEach(x => x.classList.toggle('on', x === b));
    ids.forEach(i => $(i).classList.toggle('hide', i !== b.dataset.t));
    onchange && onchange(b.dataset.t);
  });
  bs[0].click();
}

// Places a canvas on the page as a picture (app 1.5.0+).
function placeImage(cv) {
  if (A && A.insertImage) { A.insertImage(cv.toDataURL('image/png')) ? toast('Placed on your page — move or resize it with the lasso') : toast('Could not place the picture'); }
  else toast('Update Adv Notes to 1.5.0 or newer to place pictures on the page');
}
// ---- shared chemistry data: [symbol, name, atomic mass, Pauling electronegativity or 0] by Z-1 ----
const EL = `H Hydrogen 1.008 2.20|He Helium 4.0026 0|Li Lithium 6.94 0.98|Be Beryllium 9.0122 1.57|B Boron 10.81 2.04|C Carbon 12.011 2.55|N Nitrogen 14.007 3.04|O Oxygen 15.999 3.44|F Fluorine 18.998 3.98|Ne Neon 20.180 0|Na Sodium 22.990 0.93|Mg Magnesium 24.305 1.31|Al Aluminium 26.982 1.61|Si Silicon 28.085 1.90|P Phosphorus 30.974 2.19|S Sulfur 32.06 2.58|Cl Chlorine 35.45 3.16|Ar Argon 39.95 0|K Potassium 39.098 0.82|Ca Calcium 40.078 1.00|Sc Scandium 44.956 1.36|Ti Titanium 47.867 1.54|V Vanadium 50.942 1.63|Cr Chromium 51.996 1.66|Mn Manganese 54.938 1.55|Fe Iron 55.845 1.83|Co Cobalt 58.933 1.88|Ni Nickel 58.693 1.91|Cu Copper 63.546 1.90|Zn Zinc 65.38 1.65|Ga Gallium 69.723 1.81|Ge Germanium 72.630 2.01|As Arsenic 74.922 2.18|Se Selenium 78.971 2.55|Br Bromine 79.904 2.96|Kr Krypton 83.798 3.00|Rb Rubidium 85.468 0.82|Sr Strontium 87.62 0.95|Y Yttrium 88.906 1.22|Zr Zirconium 91.224 1.33|Nb Niobium 92.906 1.6|Mo Molybdenum 95.95 2.16|Tc Technetium 98 1.9|Ru Ruthenium 101.07 2.2|Rh Rhodium 102.91 2.28|Pd Palladium 106.42 2.20|Ag Silver 107.87 1.93|Cd Cadmium 112.41 1.69|In Indium 114.82 1.78|Sn Tin 118.71 1.96|Sb Antimony 121.76 2.05|Te Tellurium 127.60 2.1|I Iodine 126.90 2.66|Xe Xenon 131.29 2.60|Cs Caesium 132.91 0.79|Ba Barium 137.33 0.89|La Lanthanum 138.91 1.10|Ce Cerium 140.12 1.12|Pr Praseodymium 140.91 1.13|Nd Neodymium 144.24 1.14|Pm Promethium 145 0|Sm Samarium 150.36 1.17|Eu Europium 151.96 0|Gd Gadolinium 157.25 1.20|Tb Terbium 158.93 0|Dy Dysprosium 162.50 1.22|Ho Holmium 164.93 1.23|Er Erbium 167.26 1.24|Tm Thulium 168.93 1.25|Yb Ytterbium 173.05 0|Lu Lutetium 174.97 1.27|Hf Hafnium 178.49 1.3|Ta Tantalum 180.95 1.5|W Tungsten 183.84 2.36|Re Rhenium 186.21 1.9|Os Osmium 190.23 2.2|Ir Iridium 192.22 2.20|Pt Platinum 195.08 2.28|Au Gold 196.97 2.54|Hg Mercury 200.59 2.00|Tl Thallium 204.38 1.62|Pb Lead 207.2 2.33|Bi Bismuth 208.98 2.02|Po Polonium 209 2.0|At Astatine 210 2.2|Rn Radon 222 0|Fr Francium 223 0.7|Ra Radium 226 0.9|Ac Actinium 227 1.1|Th Thorium 232.04 1.3|Pa Protactinium 231.04 1.5|U Uranium 238.03 1.38|Np Neptunium 237 1.36|Pu Plutonium 244 1.28|Am Americium 243 1.3|Cm Curium 247 1.3|Bk Berkelium 247 1.3|Cf Californium 251 1.3|Es Einsteinium 252 1.3|Fm Fermium 257 1.3|Md Mendelevium 258 1.3|No Nobelium 259 1.3|Lr Lawrencium 266 0|Rf Rutherfordium 267 0|Db Dubnium 268 0|Sg Seaborgium 269 0|Bh Bohrium 270 0|Hs Hassium 277 0|Mt Meitnerium 278 0|Ds Darmstadtium 281 0|Rg Roentgenium 282 0|Cn Copernicium 285 0|Nh Nihonium 286 0|Fl Flerovium 289 0|Mc Moscovium 290 0|Lv Livermorium 293 0|Ts Tennessine 294 0|Og Oganesson 294 0`
  .split('|').map((r, i) => { const [s, n, m, en] = r.split(' '); return { z: i + 1, s, n, m: +m, en: +en || null }; });
const BY = Object.fromEntries(EL.map(e => [e.s, e]));

// Parses a formula like Ca(OH)2, CuSO4·5H2O, [Fe(CN)6]3-  -> { element: count }
function parseFormula(f) {
  f = String(f).replace(/\s+/g, '').replace(/\^?\d*[+-]$/, '');
  const parts = f.split(/[·•*.]/).filter(Boolean);
  const total = {};
  for (let part of parts) {
    let mult = 1; const lead = part.match(/^(\d+)(.*)$/);
    if (lead && /[A-Z(\[]/.test(lead[2][0] || '')) { mult = +lead[1]; part = lead[2]; }
    let i = 0;
    function group() {
      const out = {};
      while (i < part.length) {
        const c = part[i];
        if (c === '(' || c === '[') { i++; const g = group(); if (part[i] !== ')' && part[i] !== ']') throw new Error('Missing closing bracket'); i++; const k = num(); for (const e in g) out[e] = (out[e] || 0) + g[e] * k; }
        else if (c === ')' || c === ']') return out;
        else if (/[A-Z]/.test(c)) { let s = c; i++; while (i < part.length && /[a-z]/.test(part[i])) s += part[i++]; if (!BY[s]) throw new Error('Unknown element "' + s + '"'); const k = num(); out[s] = (out[s] || 0) + k; }
        else throw new Error('Unexpected "' + c + '"');
      }
      return out;
    }
    function num() { let d = ''; while (i < part.length && /\d/.test(part[i])) d += part[i++]; return d ? +d : 1; }
    const g = group();
    if (i < part.length) throw new Error('Unexpected "' + part[i] + '"');
    for (const e in g) total[e] = (total[e] || 0) + g[e] * mult;
  }
  if (!Object.keys(total).length) throw new Error('Enter a formula');
  return total;
}
const molarMass = comp => Object.entries(comp).reduce((a, [e, n]) => a + BY[e].m * n, 0);
const SUB = s => String(s).replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]);
const prettyFormula = f => String(f).replace(/([A-Za-z)\]])(\d+)/g, (_, a, d) => a + SUB(d)).replace(/\*/g, '·');
const fmt = (x, d = 4) => !isFinite(x) ? '—' : Math.abs(x) >= 1e5 || (x !== 0 && Math.abs(x) < 1e-3) ? x.toExponential(d - 1).replace(/e\+?(-?)(\d+)/, (_, s, e) => ' × 10' + (s ? '⁻' : '') + [...e].map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]).join('')) : String(+x.toPrecision(d + 1));

const NA = 6.02214076e23, VM = 22.414;
let M = 0, comp = null, last = 'g';
const num = s => { s = String(s).trim().replace(',', '.').replace(/\s*[x×]\s*10\^?/i, 'e'); return s === '' ? NaN : Number(s); };
function calc() {
  const f = $('f').value.trim(); db.set('last', f);
  $('err').textContent = '';
  if (!f) { $('res').classList.add('hide'); return; }
  try { comp = parseFormula(f); } catch (e) { $('err').textContent = e.message; $('res').classList.add('hide'); return; }
  M = molarMass(comp);
  $('res').classList.remove('hide');
  $('fname').textContent = prettyFormula(f);
  $('mm').textContent = 'M = ' + M.toFixed(3) + ' g/mol';
  $('parts').innerHTML = '<tr><th>Element</th><th>Count</th><th>Mass</th><th>%</th></tr>' + Object.entries(comp).map(([e, k]) =>
    `<tr><td>${e} <span class="muted">${esc(BY[e].n)}</span></td><td>${k}</td><td>${(BY[e].m * k).toFixed(3)}</td><td>${(BY[e].m * k / M * 100).toFixed(2)}</td></tr>`).join('');
  convert(last);
}
function convert(from) {
  last = from;
  const v = num($(from).value); if (!isFinite(v) || !M) { ['g','n','N','V'].filter(i => i !== from).forEach(i => $(i).value = ''); return; }
  const n = from === 'g' ? v / M : from === 'n' ? v : from === 'N' ? v / NA : v / VM;
  const out = { g: n * M, n, N: n * NA, V: n * VM };
  for (const k in out) if (k !== from) $(k).value = Math.abs(out[k]) >= 1e6 || (out[k] && Math.abs(out[k]) < 1e-4) ? out[k].toExponential(4) : +out[k].toPrecision(6);
}
['g','n','N','V'].forEach(i => $(i).oninput = () => convert(i));
$('f').oninput = calc;
$('w').onclick = () => {
  const f = prettyFormula($('f').value.trim());
  let t = `M(${f}) = ${M.toFixed(2)} g/mol`;
  if ($('g').value && $('n').value) t += `;  ${$('g').value} g = ${$('n').value} mol`;
  insert(t);
};
$('f').value = db.get('last', 'H2SO4'); calc();

})();
</script>
</body>
</html>
