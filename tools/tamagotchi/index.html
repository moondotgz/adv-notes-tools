<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamagotchi</title>
<style>
  /* Colours come from the app (Material You, set as --an-* by advnotes.js); the fallbacks are the app's own palette. */
  :root {
    --bg: var(--an-background, #F5F2FA); --fg: var(--an-onSurface, #1C1B1F); --muted: var(--an-onSurfaceVariant, #49454F);
    --accent: var(--an-primary, #3557D6); --on-accent: var(--an-onPrimary, #FFFFFF);
    --tonal: var(--an-secondaryContainer, #E0E0F9); --on-tonal: var(--an-onSecondaryContainer, #1D192B);
    --field: var(--an-surfaceContainerHighest, #E3E1E9); --card: var(--an-surfaceContainerHigh, #E9E7EF);
    --line: var(--an-outlineVariant, #CAC4D0); --outline: var(--an-outline, #79747E);
    --good: var(--an-tertiary, #0F8B6F); --warn:#C98A00; --bad: var(--an-error, #B3261E);
  }
  [data-theme="dark"] {
    --bg: var(--an-background, #1E1F25); --fg: var(--an-onSurface, #E6E1E5); --muted: var(--an-onSurfaceVariant, #CAC4D0);
    --accent: var(--an-primary, #B8C4FF); --on-accent: var(--an-onPrimary, #1B2C70);
    --tonal: var(--an-secondaryContainer, #444659); --on-tonal: var(--an-onSecondaryContainer, #E8DEF8);
    --field: var(--an-surfaceContainerHighest, #34343A); --card: var(--an-surfaceContainerHigh, #292A2F);
    --line: var(--an-outlineVariant, #49454F); --outline: var(--an-outline, #938F99);
    --good: var(--an-tertiary, #7FD8BF); --warn:#F0C050; --bad: var(--an-error, #F2B8B5);
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 Roboto,system-ui,sans-serif; max-width:420px; margin-inline:auto; }
  button { font:inherit; font-size:14px; font-weight:600; min-height:40px; padding:10px 6px; border-radius:20px; border:0; background:var(--accent); color:var(--on-accent); cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:var(--tonal); color:var(--on-tonal); }
  .screen { background:var(--card); border-radius:24px; height:200px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .screen.night { filter:brightness(.55); }
  #pet { font-size:92px; line-height:1; user-select:none; cursor:pointer; transition:transform .2s; }
  #pet.bounce { animation:bounce .5s; }
  #pet.idle { animation:idle 2.4s ease-in-out infinite; }
  @keyframes idle { 50% { transform:translateY(-6px); } }
  @keyframes bounce { 30% { transform:translateY(-24px) scale(1.1); } }
  #bubble { position:absolute; top:10px; left:10px; right:10px; text-align:center; font-size:14px; color:var(--muted); min-height:20px; }
  #poops { position:absolute; bottom:8px; right:12px; font-size:26px; }
  #meta { display:flex; justify-content:space-between; margin:10px 2px; font-size:14px; color:var(--muted); }
  .stat { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:14px; }
  .stat span:first-child { width:24px; text-align:center; }
  .bar { flex:1; height:10px; background:var(--field); border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:6px; transition:width .4s, background .4s; }
  .actions { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0 8px; }
  .actions button { border-radius:18px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:13px; }
  .actions b { font-size:22px; font-weight:400; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; }
  #say { color:var(--muted); font-size:14px; min-height:20px; margin:10px 0 0; }
</style>
</head>
<body>
  <div class="screen" id="screen">
    <div id="bubble"></div>
    <div id="pet" class="idle">🥚</div>
    <div id="poops"></div>
  </div>
  <div id="meta"><span id="name"></span><span id="age"></span></div>

  <div class="stat"><span>🍙</span><div class="bar"><i id="b-hunger"></i></div></div>
  <div class="stat"><span>😊</span><div class="bar"><i id="b-happy"></i></div></div>
  <div class="stat"><span>⚡</span><div class="bar"><i id="b-energy"></i></div></div>
  <div class="stat"><span>❤️</span><div class="bar"><i id="b-health"></i></div></div>

  <div class="actions">
    <button id="feed"><b>🍙</b>Feed</button>
    <button id="play"><b>🎾</b>Play</button>
    <button id="sleep"><b>💤</b><span id="sleepLabel">Sleep</span></button>
    <button id="clean"><b>🧼</b>Clean</button>
  </div>
  <div class="row">
    <button class="ghost" id="talk">Talk to it</button>
    <button class="ghost" id="rename">Rename</button>
    <button class="ghost" id="note">Share on page</button>
  </div>
  <p id="say"></p>

<script src="../lib/advnotes.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const tr = (s, ...a) => (window.AdvNotes && window.AdvNotes.t) ? window.AdvNotes.t(s, ...a) : a.reduce((x, v, i) => x.split('{' + i + '}').join(String(v)), s);   // translate (i18n/<lang>.json)
  const inLang = () => (window.AdvNotes && window.AdvNotes.lang && window.AdvNotes.lang !== 'en') ? ' Write all text in ' + window.AdvNotes.languageName + ' (language tag ' + window.AdvNotes.lang + ').' : '';
  const KEY = 'pet';
  const MIN = 60 * 1000;
  // Points lost per minute (awake). Slow enough to check in once or twice a day.
  const RATE = { hunger: 0.12, happy: 0.08, energy: 0.05 };
  const MAX_AWAY = 24 * 60; // minutes of absence that count toward decay
  const clamp = v => Math.max(0, Math.min(100, v));

  // --- storage: AdvNotes.storage when available, localStorage otherwise
  const store = {
    get() {
      try { const v = window.AdvNotes && AdvNotes.storage ? AdvNotes.storage.get(KEY) : localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch { return null; }
    },
    set(o) {
      const s = JSON.stringify(o);
      try { window.AdvNotes && AdvNotes.storage ? AdvNotes.storage.set(KEY, s) : localStorage.setItem(KEY, s); } catch {}
    }
  };

  const fresh = () => ({ name: 'Pixel', born: Date.now(), last: Date.now(), hunger: 80, happy: 80, energy: 80, health: 100, poops: 0, sleeping: false, hatched: false, dead: false, sinceClean: 0 });
  let s = store.get() || fresh();

  // --- simulation
  function tick(now) {
    let mins = Math.min((now - s.last) / MIN, MAX_AWAY);
    s.last = now;
    if (mins <= 0 || s.dead) return;
    if (!s.hatched) { if (now - s.born > 10 * 1000) s.hatched = true; return; }
    if (s.sleeping) {
      s.energy = clamp(s.energy + mins * 0.6);
      s.hunger = clamp(s.hunger - mins * RATE.hunger * 0.4);
      if (s.energy >= 100) s.sleeping = false;
    } else {
      s.hunger = clamp(s.hunger - mins * RATE.hunger);
      s.happy = clamp(s.happy - mins * RATE.happy);
      s.energy = clamp(s.energy - mins * RATE.energy);
    }
    s.sinceClean += mins;
    while (s.sinceClean >= 90 && s.poops < 3) { s.poops++; s.sinceClean -= 90; }
    if (s.poops >= 3) s.sinceClean = 0;
    // health suffers when neglected, recovers when things are fine
    const neglect = (s.hunger < 15) + (s.happy < 15) + (s.poops >= 2) + (s.energy < 10);
    s.health = clamp(s.health + mins * (neglect ? -0.15 * neglect : 0.1));
    if (s.health <= 0) s.dead = true;
  }

  // --- rendering
  function mood() {
    if (s.dead) return ['👻', tr('Your pet has passed away…')];
    if (!s.hatched) return ['🥚', tr('Something is moving inside the egg…')];
    if (s.sleeping) return ['😴', tr('zzz…')];
    if (s.health < 30) return ['🤒', tr('I don\'t feel well…')];
    if (s.hunger < 25) return ['😫', tr('I\'m so hungry!')];
    if (s.poops >= 2) return ['🤢', tr('It smells in here…')];
    if (s.energy < 20) return ['🥱', tr('So tired…')];
    if (s.happy < 25) return ['😢', tr('I\'m bored. Play with me?')];
    if (s.happy > 75 && s.hunger > 50) return ['🥰', tr('Life is good!')];
    return ['🙂', ''];
  }
  const color = v => v > 50 ? 'var(--good)' : v > 25 ? 'var(--warn)' : 'var(--bad)';
  function bar(id, v) { const e = $(id); e.style.width = v + '%'; e.style.background = color(v); }
  function fmtAge() {
    const m = Math.floor((Date.now() - s.born) / MIN);
    const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60);
    return d ? tr('{0}d {1}h old', d, h) : h ? tr('{0}h {1}m old', h, m % 60) : tr('{0}m old', m);
  }
  function render() {
    const [face, msg] = mood();
    $('pet').textContent = face;
    $('pet').className = s.dead || s.sleeping ? '' : 'idle';
    $('bubble').textContent = msg;
    $('screen').classList.toggle('night', s.sleeping);
    $('poops').textContent = '💩'.repeat(s.poops);
    $('name').textContent = s.dead ? s.name + ' ✝' : s.name;
    $('age').textContent = fmtAge();
    bar('b-hunger', s.hunger); bar('b-happy', s.happy); bar('b-energy', s.energy); bar('b-health', s.health);
    $('sleepLabel').textContent = s.sleeping ? tr('Wake') : tr('Sleep');
    const off = !s.hatched;
    ['feed', 'play', 'clean', 'sleep', 'talk'].forEach(id => $(id).disabled = s.dead || off || (s.sleeping && id !== 'sleep' && id !== 'talk' && id !== 'clean'));
    $('sleep').disabled = s.dead || off;
    $('rename').disabled = false;
    $('note').disabled = off;
  }
  function save() { store.set(s); }
  function bounce() { const p = $('pet'); p.classList.remove('bounce'); void p.offsetWidth; p.classList.add('bounce'); }
  function say(t) { $('say').textContent = t; }
  function update() { tick(Date.now()); render(); save(); }

  // --- actions
  $('feed').onclick = () => {
    if (s.hunger > 95) return say(tr('{0} is stuffed.', s.name));
    s.hunger = clamp(s.hunger + 30); s.health = clamp(s.health + 2);
    s.sinceClean += 20; bounce(); say(tr('Nom nom nom 🍙')); update();
  };
  $('play').onclick = () => {
    if (s.energy < 10) return say(tr('{0} is too tired to play.', s.name));
    s.happy = clamp(s.happy + 25); s.energy = clamp(s.energy - 8); s.hunger = clamp(s.hunger - 5);
    bounce(); say(tr('Wheee! 🎾')); update();
  };
  $('sleep').onclick = () => { s.sleeping = !s.sleeping; say(s.sleeping ? tr('Sweet dreams…') : tr('Good morning!')); update(); };
  $('clean').onclick = () => {
    if (!s.poops) return say(tr('Already spotless.'));
    s.poops = 0; s.happy = clamp(s.happy + 5); bounce(); say(tr('Squeaky clean 🧼')); update();
  };
  $('pet').onclick = () => {
    if (s.dead) { if (confirm(tr('Start over with a new egg?'))) { s = fresh(); say(''); update(); } return; }
    if (!s.hatched || s.sleeping) return;
    s.happy = clamp(s.happy + 2); bounce(); say(tr('{0} giggles.', s.name)); update();
  };
  $('rename').onclick = () => {
    const n = prompt('Name your pet:', s.name);
    if (n && n.trim()) { s.name = n.trim().slice(0, 20); update(); }
  };
  $('note').onclick = () => {
    const [face] = mood();
    const txt = `${face} ${s.name} (${fmtAge()}): ` + tr('hunger {0}%, happiness {1}%, energy {2}%', Math.round(s.hunger), Math.round(s.happy), Math.round(s.energy));
    try { window.AdvNotes && AdvNotes.insertText(txt); say(tr('Written on your page.')); } catch (e) { say(e.message); }
  };
  $('talk').onclick = async () => {
    const [, msg] = mood();
    if (!window.AdvNotes || !AdvNotes.ask) return say(msg || tr('{0} chirps happily.', s.name));
    say('…');
    try {
      await AdvNotes.ask(`You are a tiny virtual pet named ${s.name}. Your stats out of 100: hunger ${Math.round(s.hunger)} (low = hungry), happiness ${Math.round(s.happy)}, energy ${Math.round(s.energy)}, health ${Math.round(s.health)}. Say one short, cute sentence in character reflecting how you feel. No quotes.` + inLang(), { onText: t => say(t) });
    } catch (e) { say(msg || e.message); }
  };

  update();
  setInterval(update, 15 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) update(); });
})();
</script>
</body>
</html>
