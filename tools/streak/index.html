<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study streak</title>
<style>
  /* Colours come from the app (Material You, set as --an-* by advnotes.js); the fallbacks are the app's own palette. */
  :root {
    --bg: var(--an-background, #F5F2FA); --fg: var(--an-onSurface, #1C1B1F); --muted: var(--an-onSurfaceVariant, #49454F);
    --accent: var(--an-primary, #3557D6); --on-accent: var(--an-onPrimary, #FFFFFF);
    --tonal: var(--an-secondaryContainer, #E0E0F9); --on-tonal: var(--an-onSecondaryContainer, #1D192B);
    --field: var(--an-surfaceContainerHighest, #E3E1E9); --card: var(--an-surfaceContainerHigh, #E9E7EF);
    --line: var(--an-outlineVariant, #CAC4D0); --outline: var(--an-outline, #79747E);
    --good: var(--an-tertiary, #0F8B6F); --warn:#C98A00; --bad: var(--an-error, #B3261E);
  }
  [data-theme="dark"] {
    --bg: var(--an-background, #1E1F25); --fg: var(--an-onSurface, #E6E1E5); --muted: var(--an-onSurfaceVariant, #CAC4D0);
    --accent: var(--an-primary, #B8C4FF); --on-accent: var(--an-onPrimary, #1B2C70);
    --tonal: var(--an-secondaryContainer, #444659); --on-tonal: var(--an-onSecondaryContainer, #E8DEF8);
    --field: var(--an-surfaceContainerHighest, #34343A); --card: var(--an-surfaceContainerHigh, #292A2F);
    --line: var(--an-outlineVariant, #49454F); --outline: var(--an-outline, #938F99);
    --good: var(--an-tertiary, #7FD8BF); --warn:#F0C050; --bad: var(--an-error, #F2B8B5);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 Roboto, system-ui, sans-serif; max-width:560px; margin-inline:auto; accent-color:var(--accent); }
  h2 { font-size:16px; font-weight:600; margin:0 0 10px; }
  input, select, textarea, button { font:inherit; color:var(--fg); }
  input, select, textarea { width:100%; padding:12px 14px; border-radius:12px; border:1px solid transparent; background:var(--field); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  input[type=checkbox], input[type=radio] { width:18px; height:18px; padding:0; }
  input[type=range] { background:none; padding:0; border:0; }
  ::placeholder { color:var(--muted); opacity:.8; }
  textarea { resize:vertical; min-height:84px; }
  button { min-height:40px; padding:8px 20px; border:0; border-radius:20px; background:var(--accent); color:var(--on-accent);
           font-size:14px; font-weight:600; letter-spacing:.1px; cursor:pointer; transition:filter .15s, opacity .15s; }
  button:active { filter:brightness(.92); }
  button.ghost { background:var(--tonal); color:var(--on-tonal); }
  button:disabled { opacity:.38; cursor:default; }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row > * { flex:1; min-width:0; }
  .row > .fit { flex:0 0 auto; }
  .row button.fit { padding:6px 14px; min-height:32px; border-radius:8px; }
  .tabs { display:flex; margin-bottom:14px; border:1px solid var(--outline); border-radius:20px; overflow:hidden; }
  .tabs button { flex:1; border-radius:0; background:transparent; color:var(--fg); padding:8px 4px; min-height:40px; }
  .tabs button + button { border-left:1px solid var(--outline); }
  .tabs button.on { background:var(--tonal); color:var(--on-tonal); }
  .card { background:var(--card); border-radius:18px; padding:16px; margin:10px 0; }
  .card input, .card select, .card textarea { background:var(--bg); }
  .muted { color:var(--muted); font-size:14px; }
  .hide { display:none !important; }
  .err { color:var(--bad); font-size:14px; }
  .pre { white-space:pre-wrap; }
</style>
</head>
<body>

<div class="row" style="text-align:center">
  <div class="card"><div style="font-size:34px" id="cur">0</div><div class="muted">day streak 🔥</div></div>
  <div class="card"><div style="font-size:34px" id="best">0</div><div class="muted">best streak</div></div>
  <div class="card"><div style="font-size:34px" id="total">0</div><div class="muted">days studied</div></div>
</div>
<div class="row"><input id="min" type="number" min="0" placeholder="Minutes (optional)" class="fit" style="width:140px"><button id="check">I studied today</button></div>
<div class="muted" id="msg" style="text-align:center"></div>
<div class="row" style="margin-top:14px"><button class="ghost fit" id="prev">‹</button><div id="monthName" style="text-align:center"></div><button class="ghost fit" id="next">›</button></div>
<div id="cal" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div>
<div class="row"><button class="ghost" id="ins">Write streak on page</button></div>

<script src="../lib/advnotes.js"></script>
<script>
(() => {

const $ = id => document.getElementById(id);

const tr = (s, ...a) => (window.AdvNotes && window.AdvNotes.t) ? window.AdvNotes.t(s, ...a) : a.reduce((x, v, i) => x.split('{' + i + '}').join(String(v)), s);   // translate (i18n/<lang>.json)
const inLang = () => (window.AdvNotes && window.AdvNotes.lang && window.AdvNotes.lang !== 'en') ? ' Write all text in ' + window.AdvNotes.languageName + ' (language tag ' + window.AdvNotes.lang + ').' : '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A = window.AdvNotes;
const db = {
  get(k, d) {
    try {
      if (A && A.storage && A.storage.getJSON) return A.storage.getJSON(k, d);
      const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v);
    } catch { return d; }
  },
  set(k, v) {
    try {
      if (A && A.storage && A.storage.setJSON) return A.storage.setJSON(k, v);
      localStorage.setItem(k, JSON.stringify(v));
    } catch {}
  }
};
function toast(m) { try { A && A.toast ? A.toast(m) : null; } catch {} }
function insert(t) {
  if (A && A.insertText) { A.insertText(t); toast(tr('Written on your page')); } else alert(t);
}
// Ask the AI; resolves with the answer text. src: 'page' | 'selection' | undefined
async function ask(prompt, opts = {}) {
  if (!A || !A.ask) throw new Error(tr('AI is not available here.'));
  const r = await A.ask(prompt, opts);
  return typeof r === 'string' ? r : (r && r.text) || '';
}
// Pull the first JSON array/object out of an AI answer, tolerating code fences and chatter.
function parseJSON(t) {
  t = t.replace(/```(?:json)?/gi, '');
  const a = t.search(/[\[{]/); if (a < 0) throw new Error(tr('The AI did not return structured data. Try again.'));
  const open = t[a], close = open === '[' ? ']' : '}';
  const b = t.lastIndexOf(close);
  return JSON.parse(t.slice(a, b + 1));
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayNum = s => Math.round(Date.parse(s + 'T00:00:00Z') / 864e5);
function tabs(ids, onchange) {
  const bs = [...document.querySelectorAll('.tabs button')];
  bs.forEach(b => b.onclick = () => {
    bs.forEach(x => x.classList.toggle('on', x === b));
    ids.forEach(i => $(i).classList.toggle('hide', i !== b.dataset.t));
    onchange && onchange(b.dataset.t);
  });
  bs[0].click();
}

let log = db.get('days', {});        // 'YYYY-MM-DD' -> minutes (0 = checked in, unknown length)
let view = new Date(); view.setDate(1);
const key = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function stats() {
  const days = Object.keys(log).sort(), set = new Set(days);
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev !== null && dayNum(d) - prev === 1 ? run + 1 : 1; best = Math.max(best, run); prev = dayNum(d); }
  // current streak: counts back from today, or from yesterday if today isn't checked in yet
  let cur = 0, t = dayNum(today());
  if (!set.has(today())) t--;
  const nums = new Set(days.map(dayNum));
  while (nums.has(t)) { cur++; t--; }
  return { cur, best, total: days.length };
}
function render() {
  const s = stats();
  $('cur').textContent = s.cur; $('best').textContent = s.best; $('total').textContent = s.total;
  const done = today() in log;
  $('check').textContent = done ? tr('Update today') : tr('I studied today');
  $('msg').textContent = done ? (log[today()] ? tr('Today is logged ({0} min). Nice work!', log[today()]) : tr('Today is logged. Nice work!')) : (s.cur ? tr('Keep your {0}-day streak alive!', s.cur) : tr('Start a streak today.'));
  $('monthName').textContent = view.toLocaleDateString((window.AdvNotes && window.AdvNotes.lang) || undefined, { month: 'long', year: 'numeric' });
  const first = (view.getDay() + 6) % 7, n = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  const max = Math.max(60, ...Object.values(log));
  let h = [0,1,2,3,4,5,6].map(i => new Date(2024, 0, 1 + i).toLocaleDateString((window.AdvNotes && window.AdvNotes.lang) || undefined, { weekday: 'narrow' })).map(x => `<div class="muted" style="text-align:center;font-size:12px">${x}</div>`).join('');
  h += '<div></div>'.repeat(first);
  for (let d = 1; d <= n; d++) {
    const k = key(new Date(view.getFullYear(), view.getMonth(), d)), has = k in log;
    const a = has ? 0.35 + 0.65 * Math.min(1, (log[k] || 30) / max) : 0;
    h += `<div data-k="${k}" style="aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:${has ? `color-mix(in srgb, var(--good) ${Math.round(a * 100)}%, var(--field))` : 'var(--field)'};${k === today() ? 'outline:2px solid var(--accent);' : ''}${has ? 'color:#fff;' : 'color:var(--muted);'}">${d}</div>`;
  }
  $('cal').innerHTML = h;
  // tap any past/present day to toggle it (e.g. to fix a forgotten check-in)
  $('cal').querySelectorAll('[data-k]').forEach(el => el.onclick = () => {
    const k = el.dataset.k; if (k > today()) return;
    if (k in log) delete log[k]; else log[k] = 0;
    db.set('days', log); render();
  });
}
$('check').onclick = () => { log[today()] = Math.max(0, +$('min').value || log[today()] || 0); db.set('days', log); $('min').value = ''; render(); };
$('prev').onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$('next').onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
$('ins').onclick = () => { const s = stats(); insert(tr('Study streak: {0} days 🔥 (best {1}, {2} days total)', s.cur, s.best, s.total)); };
render();

})();
</script>
</body>
</html>
