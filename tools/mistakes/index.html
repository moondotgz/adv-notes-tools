<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mistake log</title>
<style>
  /* Colours come from the app (Material You, set as --an-* by advnotes.js); the fallbacks are the app's own palette. */
  :root {
    --bg: var(--an-background, #F5F2FA); --fg: var(--an-onSurface, #1C1B1F); --muted: var(--an-onSurfaceVariant, #49454F);
    --accent: var(--an-primary, #3557D6); --on-accent: var(--an-onPrimary, #FFFFFF);
    --tonal: var(--an-secondaryContainer, #E0E0F9); --on-tonal: var(--an-onSecondaryContainer, #1D192B);
    --field: var(--an-surfaceContainerHighest, #E3E1E9); --card: var(--an-surfaceContainerHigh, #E9E7EF);
    --line: var(--an-outlineVariant, #CAC4D0); --outline: var(--an-outline, #79747E);
    --good: var(--an-tertiary, #0F8B6F); --warn:#C98A00; --bad: var(--an-error, #B3261E);
  }
  [data-theme="dark"] {
    --bg: var(--an-background, #1E1F25); --fg: var(--an-onSurface, #E6E1E5); --muted: var(--an-onSurfaceVariant, #CAC4D0);
    --accent: var(--an-primary, #B8C4FF); --on-accent: var(--an-onPrimary, #1B2C70);
    --tonal: var(--an-secondaryContainer, #444659); --on-tonal: var(--an-onSecondaryContainer, #E8DEF8);
    --field: var(--an-surfaceContainerHighest, #34343A); --card: var(--an-surfaceContainerHigh, #292A2F);
    --line: var(--an-outlineVariant, #49454F); --outline: var(--an-outline, #938F99);
    --good: var(--an-tertiary, #7FD8BF); --warn:#F0C050; --bad: var(--an-error, #F2B8B5);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 Roboto, system-ui, sans-serif; max-width:560px; margin-inline:auto; accent-color:var(--accent); }
  h2 { font-size:16px; font-weight:600; margin:0 0 10px; }
  input, select, textarea, button { font:inherit; color:var(--fg); }
  input, select, textarea { width:100%; padding:12px 14px; border-radius:12px; border:1px solid transparent; background:var(--field); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  input[type=checkbox], input[type=radio] { width:18px; height:18px; padding:0; }
  input[type=range] { background:none; padding:0; border:0; }
  ::placeholder { color:var(--muted); opacity:.8; }
  textarea { resize:vertical; min-height:84px; }
  button { min-height:40px; padding:8px 20px; border:0; border-radius:20px; background:var(--accent); color:var(--on-accent);
           font-size:14px; font-weight:600; letter-spacing:.1px; cursor:pointer; transition:filter .15s, opacity .15s; }
  button:active { filter:brightness(.92); }
  button.ghost { background:var(--tonal); color:var(--on-tonal); }
  button:disabled { opacity:.38; cursor:default; }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row > * { flex:1; min-width:0; }
  .row > .fit { flex:0 0 auto; }
  .row button.fit { padding:6px 14px; min-height:32px; border-radius:8px; }
  .tabs { display:flex; margin-bottom:14px; border:1px solid var(--outline); border-radius:20px; overflow:hidden; }
  .tabs button { flex:1; border-radius:0; background:transparent; color:var(--fg); padding:8px 4px; min-height:40px; }
  .tabs button + button { border-left:1px solid var(--outline); }
  .tabs button.on { background:var(--tonal); color:var(--on-tonal); }
  .card { background:var(--card); border-radius:18px; padding:16px; margin:10px 0; }
  .card input, .card select, .card textarea { background:var(--bg); }
  .muted { color:var(--muted); font-size:14px; }
  .hide { display:none !important; }
  .err { color:var(--bad); font-size:14px; }
  .pre { white-space:pre-wrap; }
  .shot { max-width:100%; border-radius:10px; background:#fff; margin:8px 0; display:block; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; background:var(--bg); color:var(--muted); }
</style>
</head>
<body>

<div class="tabs"><button data-t="add">Add</button><button data-t="review">Review <span id="due"></span></button><button data-t="list">All</button></div>
<div id="add">
  <div class="muted">Circle the wrong working with the lasso, then capture it.</div>
  <div class="row"><button id="cap">Capture lasso selection</button></div>
  <img id="prev" class="shot hide">
  <div class="row"><input id="topic" placeholder="Topic (e.g. Electron configuration)" list="topics"></div>
  <datalist id="topics"></datalist>
  <div class="row"><textarea id="wrong" placeholder="What went wrong?"></textarea></div>
  <div class="row"><textarea id="right" placeholder="The correct answer / rule"></textarea></div>
  <div class="row"><button id="save">Save mistake</button></div>
  <div id="aerr" class="err"></div>
</div>
<div id="review">
  <div id="rv"></div>
</div>
<div id="list">
  <select id="ftopic"></select>
  <div id="items"></div>
</div>

<script src="../lib/advnotes.js"></script>
<script>
(() => {

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A = window.AdvNotes;
const db = {
  get(k, d) {
    try {
      if (A && A.storage && A.storage.getJSON) return A.storage.getJSON(k, d);
      const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v);
    } catch { return d; }
  },
  set(k, v) {
    try {
      if (A && A.storage && A.storage.setJSON) return A.storage.setJSON(k, v);
      localStorage.setItem(k, JSON.stringify(v));
    } catch {}
  }
};
function toast(m) { try { A && A.toast ? A.toast(m) : null; } catch {} }
function insert(t) {
  if (A && A.insertText) { A.insertText(t); toast('Written on your page'); } else alert(t);
}
// Ask the AI; resolves with the answer text. src: 'page' | 'selection' | undefined
async function ask(prompt, opts = {}) {
  if (!A || !A.ask) throw new Error('AI is not available here.');
  const r = await A.ask(prompt, opts);
  return typeof r === 'string' ? r : (r && r.text) || '';
}
// Pull the first JSON array/object out of an AI answer, tolerating code fences and chatter.
function parseJSON(t) {
  t = t.replace(/```(?:json)?/gi, '');
  const bad = () => new Error('The AI did not return structured data. It said: "' + t.trim().slice(0, 160) + (t.trim().length > 160 ? '…' : '') + '"');
  const a = t.search(/[\[{]/); if (a < 0) throw bad();
  const open = t[a], close = open === '[' ? ']' : '}';
  const b = t.lastIndexOf(close);
  try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw bad(); }
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayNum = s => Math.round(Date.parse(s + 'T00:00:00Z') / 864e5);
function tabs(ids, onchange) {
  const bs = [...document.querySelectorAll('.tabs button')];
  bs.forEach(b => b.onclick = () => {
    bs.forEach(x => x.classList.toggle('on', x === b));
    ids.forEach(i => $(i).classList.toggle('hide', i !== b.dataset.t));
    onchange && onchange(b.dataset.t);
  });
  bs[0].click();
}

// Places a canvas on the page as a picture (app 1.5.0+).
function placeImage(cv) {
  if (A && A.insertImage) { A.insertImage(cv.toDataURL('image/png')) ? toast('Placed on your page — move or resize it with the lasso') : toast('Could not place the picture'); }
  else toast('Update Adv Notes to 1.5.0 or newer to place pictures on the page');
}
// Leitner boxes: after a correct review, the mistake comes back after 1, 3, 7, 14, 30 days.
const GAPS = [0, 1, 3, 7, 14, 30];
let items = db.get('items', []);
let shot = null;
const save = () => db.set('items', items);
const due = () => items.filter(x => dayNum(x.due) <= dayNum(today()));
const addDays = (d, n) => { const t = new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5); return t.toISOString().slice(0, 10); };
function shrink(dataUrl) {
  return new Promise(res => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 900 / Math.max(im.width, im.height)); const c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.8)); };
    im.onerror = () => res(null); im.src = dataUrl; });
}
$('cap').onclick = async () => {
  $('aerr').textContent = '';
  const d = A && A.selectionImage ? A.selectionImage() : null;
  if (!d) { $('aerr').textContent = 'Select something with the lasso first.'; return; }
  shot = await shrink(d); $('prev').src = shot; $('prev').classList.remove('hide');
};
$('save').onclick = () => {
  const topic = $('topic').value.trim() || 'General', wrong = $('wrong').value.trim(), right = $('right').value.trim();
  if (!shot && !wrong) { $('aerr').textContent = 'Capture the mistake or describe it.'; return; }
  items.push({ id: Date.now().toString(36), topic, wrong, right, img: shot, box: 0, due: today(), added: today() });
  save(); shot = null; $('prev').classList.add('hide'); $('wrong').value = $('right').value = '';
  toast('Saved — it will come up in Review'); refresh();
};
let cur = null, revealed = false;
function renderReview() {
  const d = due();
  if (!d.length) { $('rv').innerHTML = `<p class="muted">Nothing due. ${items.length ? 'Next one is due ' + items.map(x => x.due).sort()[0] + '.' : 'Add a mistake first.'}</p>`; return; }
  cur = d[0];
  $('rv').innerHTML = `<div class="card"><span class="pill">${esc(cur.topic)}</span> <span class="muted">${d.length} due</span>
    ${cur.img ? `<img class="shot" src="${cur.img}">` : ''}
    ${cur.wrong ? `<div class="pre">${esc(cur.wrong)}</div>` : ''}
    <p class="muted">What's wrong and what is right? Think, then reveal.</p>
    <div id="ans" class="${revealed ? '' : 'hide'}"><div class="pre" style="font-size:17px">${esc(cur.right || '(no answer saved)')}</div></div>
    <div class="row">${revealed ? '<button id="again" class="ghost">Got it wrong again</button><button id="ok">I knew it</button>' : '<button id="rev">Reveal</button>'}</div></div>`;
  if (!revealed) $('rev').onclick = () => { revealed = true; renderReview(); };
  else {
    $('ok').onclick = () => { cur.box = Math.min(cur.box + 1, GAPS.length - 1); cur.due = addDays(today(), GAPS[cur.box]); next(); };
    $('again').onclick = () => { cur.box = 0; cur.due = addDays(today(), 1); next(); };
  }
}
function next() { revealed = false; save(); refresh(); }
function renderList() {
  const topics = [...new Set(items.map(x => x.topic))].sort();
  const f = $('ftopic').value;
  $('ftopic').innerHTML = '<option value="">All topics</option>' + topics.map(t => `<option ${t === f ? 'selected' : ''}>${esc(t)}</option>`).join('');
  $('topics').innerHTML = topics.map(t => `<option value="${esc(t)}">`).join('');
  const shown = items.filter(x => !f || x.topic === f).slice().reverse();
  $('items').innerHTML = shown.map(x => `<div class="card"><span class="pill">${esc(x.topic)}</span> <span class="muted">due ${x.due}</span>
    ${x.img ? `<img class="shot" src="${x.img}">` : ''}${x.wrong ? `<div class="pre muted">${esc(x.wrong)}</div>` : ''}
    <div class="pre" style="margin-top:4px">✔ ${esc(x.right || '—')}</div>
    <div class="row"><button class="ghost" data-w="${x.id}">Write answer on page</button><button class="ghost fit" data-d="${x.id}">Delete</button></div></div>`).join('') || '<p class="muted">No mistakes saved yet.</p>';
  $('items').querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const x = items.find(i => i.id === b.dataset.w); insert(`${x.topic}: ${x.right || x.wrong}`); });
  $('items').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { if (confirm('Delete this mistake?')) { items = items.filter(i => i.id !== b.dataset.d); save(); refresh(); } });
}
function refresh() { const n = due().length; $('due').textContent = n ? '(' + n + ')' : ''; renderReview(); renderList(); }
$('ftopic').onchange = renderList;
tabs(['add', 'review', 'list'], refresh);
refresh();

})();
</script>
</body>
</html>
