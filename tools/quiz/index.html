<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz me</title>
<style>
  /* Colours come from the app (Material You, set as --an-* by advnotes.js); the fallbacks are the app's own palette. */
  :root {
    --bg: var(--an-background, #F5F2FA); --fg: var(--an-onSurface, #1C1B1F); --muted: var(--an-onSurfaceVariant, #49454F);
    --accent: var(--an-primary, #3557D6); --on-accent: var(--an-onPrimary, #FFFFFF);
    --tonal: var(--an-secondaryContainer, #E0E0F9); --on-tonal: var(--an-onSecondaryContainer, #1D192B);
    --field: var(--an-surfaceContainerHighest, #E3E1E9); --card: var(--an-surfaceContainerHigh, #E9E7EF);
    --line: var(--an-outlineVariant, #CAC4D0); --outline: var(--an-outline, #79747E);
    --good: var(--an-tertiary, #0F8B6F); --warn:#C98A00; --bad: var(--an-error, #B3261E);
  }
  [data-theme="dark"] {
    --bg: var(--an-background, #1E1F25); --fg: var(--an-onSurface, #E6E1E5); --muted: var(--an-onSurfaceVariant, #CAC4D0);
    --accent: var(--an-primary, #B8C4FF); --on-accent: var(--an-onPrimary, #1B2C70);
    --tonal: var(--an-secondaryContainer, #444659); --on-tonal: var(--an-onSecondaryContainer, #E8DEF8);
    --field: var(--an-surfaceContainerHighest, #34343A); --card: var(--an-surfaceContainerHigh, #292A2F);
    --line: var(--an-outlineVariant, #49454F); --outline: var(--an-outline, #938F99);
    --good: var(--an-tertiary, #7FD8BF); --warn:#F0C050; --bad: var(--an-error, #F2B8B5);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 Roboto, system-ui, sans-serif; max-width:560px; margin-inline:auto; accent-color:var(--accent); }
  h2 { font-size:16px; font-weight:600; margin:0 0 10px; }
  input, select, textarea, button { font:inherit; color:var(--fg); }
  input, select, textarea { width:100%; padding:12px 14px; border-radius:12px; border:1px solid transparent; background:var(--field); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  input[type=checkbox], input[type=radio] { width:18px; height:18px; padding:0; }
  input[type=range] { background:none; padding:0; border:0; }
  ::placeholder { color:var(--muted); opacity:.8; }
  textarea { resize:vertical; min-height:84px; }
  button { min-height:40px; padding:8px 20px; border:0; border-radius:20px; background:var(--accent); color:var(--on-accent);
           font-size:14px; font-weight:600; letter-spacing:.1px; cursor:pointer; transition:filter .15s, opacity .15s; }
  button:active { filter:brightness(.92); }
  button.ghost { background:var(--tonal); color:var(--on-tonal); }
  button:disabled { opacity:.38; cursor:default; }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row > * { flex:1; min-width:0; }
  .row > .fit { flex:0 0 auto; }
  .row button.fit { padding:6px 14px; min-height:32px; border-radius:8px; }
  .tabs { display:flex; margin-bottom:14px; border:1px solid var(--outline); border-radius:20px; overflow:hidden; }
  .tabs button { flex:1; border-radius:0; background:transparent; color:var(--fg); padding:8px 4px; min-height:40px; }
  .tabs button + button { border-left:1px solid var(--outline); }
  .tabs button.on { background:var(--tonal); color:var(--on-tonal); }
  .card { background:var(--card); border-radius:18px; padding:16px; margin:10px 0; }
  .card input, .card select, .card textarea { background:var(--bg); }
  .muted { color:var(--muted); font-size:14px; }
  .hide { display:none !important; }
  .err { color:var(--bad); font-size:14px; }
  .pre { white-space:pre-wrap; }
</style>
</head>
<body>

<div id="setup">
  <h2>Quiz me</h2>
  <input id="topic" placeholder="Topic (e.g. photosynthesis) — or leave empty to use your page">
  <div class="row">
    <select id="src"><option value="">Topic only</option><option value="selection">Lasso selection</option><option value="page">Visible page</option></select>
    <input id="n" type="number" min="3" max="15" value="5" class="fit" style="width:80px">
  </div>
  <select id="level"><option>Easy</option><option selected>Medium</option><option>Hard</option></select>
  <div class="row"><button id="start">Start quiz</button></div>
  <div class="row"><button class="ghost" id="drill">Drill weak topics</button></div>
  <div id="weak" class="muted"></div>
  <div id="serr" class="err"></div>
</div>

<div id="play" class="hide">
  <div class="muted" id="prog"></div>
  <div class="card" id="qtext" style="font-size:18px"></div>
  <div id="opts"></div>
  <div id="fb" class="card hide"></div>
  <div class="row"><button id="nextBtn" class="hide">Next</button></div>
</div>

<div id="done" class="hide">
  <h2 id="score"></h2>
  <div id="review"></div>
  <div class="row"><button id="again">New quiz</button><button class="ghost" id="logit">Write score on page</button></div>
</div>

<script src="../lib/advnotes.js"></script>
<script>
(() => {

const $ = id => document.getElementById(id);

const tr = (s, ...a) => (window.AdvNotes && window.AdvNotes.t) ? window.AdvNotes.t(s, ...a) : a.reduce((x, v, i) => x.split('{' + i + '}').join(String(v)), s);   // translate (i18n/<lang>.json)
const inLang = () => (window.AdvNotes && window.AdvNotes.lang && window.AdvNotes.lang !== 'en') ? ' Write all text in ' + window.AdvNotes.languageName + ' (language tag ' + window.AdvNotes.lang + ').' : '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A = window.AdvNotes;
const db = {
  get(k, d) {
    try {
      if (A && A.storage && A.storage.getJSON) return A.storage.getJSON(k, d);
      const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v);
    } catch { return d; }
  },
  set(k, v) {
    try {
      if (A && A.storage && A.storage.setJSON) return A.storage.setJSON(k, v);
      localStorage.setItem(k, JSON.stringify(v));
    } catch {}
  }
};
function toast(m) { try { A && A.toast ? A.toast(m) : null; } catch {} }
function insert(t) {
  if (A && A.insertText) { A.insertText(t); toast(tr('Written on your page')); } else alert(t);
}
// Ask the AI; resolves with the answer text. src: 'page' | 'selection' | undefined
async function ask(prompt, opts = {}) {
  if (!A || !A.ask) throw new Error(tr('AI is not available here.'));
  const r = await A.ask(prompt, opts);
  return typeof r === 'string' ? r : (r && r.text) || '';
}
// Pull the first JSON array/object out of an AI answer, tolerating code fences and chatter.
function parseJSON(t) {
  t = t.replace(/```(?:json)?/gi, '');
  const bad = () => new Error(tr('The AI did not return structured data. It said: "{0}"', t.trim().slice(0, 160) + (t.trim().length > 160 ? '…' : '')));
  const a = t.search(/[\[{]/); if (a < 0) throw bad();
  const open = t[a], close = open === '[' ? ']' : '}';
  const b = t.lastIndexOf(close);
  try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw bad(); }
}
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayNum = s => Math.round(Date.parse(s + 'T00:00:00Z') / 864e5);
function tabs(ids, onchange) {
  const bs = [...document.querySelectorAll('.tabs button')];
  bs.forEach(b => b.onclick = () => {
    bs.forEach(x => x.classList.toggle('on', x === b));
    ids.forEach(i => $(i).classList.toggle('hide', i !== b.dataset.t));
    onchange && onchange(b.dataset.t);
  });
  bs[0].click();
}

let weak = db.get('weak', {});   // topic -> number of misses
let qs = [], i = 0, right = 0, missed = [], topicName = '';
const saveW = () => db.set('weak', weak);

function show(id) { ['setup', 'play', 'done'].forEach(x => $(x).classList.toggle('hide', x !== id)); }
function renderWeak() {
  const w = Object.entries(weak).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  $('weak').innerHTML = w.length ? tr('Weak spots: {0}', w.slice(0, 6).map(([t, n]) => `${esc(t)} (${n})`).join(', ')) : tr('No weak spots recorded yet.');
  $('drill').disabled = !w.length;
}

async function build(topic, src, n, level) {
  const what = src ? 'the content of the attached image' + (topic ? ` (focus: ${topic})` : '') : `the topic "${topic}"`;
  const t = await ask(`Write ${n} ${level.toLowerCase()} multiple-choice questions about ${what}. Each has exactly 4 options and one correct answer. Reply with ONLY a JSON array like [{"q":"...","options":["A","B","C","D"],"answer":0,"topic":"short subtopic","why":"one-sentence explanation"}] where answer is the index of the correct option.` + inLang(), src ? { image: src } : {});
  const arr = parseJSON(t).filter(x => x && x.q && Array.isArray(x.options) && x.options.length >= 2 && Number.isInteger(x.answer) && x.answer >= 0 && x.answer < x.options.length);
  if (!arr.length) throw new Error(tr('No usable questions came back. Try again.'));
  return arr;
}
async function begin(topic, src, n, level) {
  $('serr').textContent = ''; $('start').disabled = $('drill').disabled = true; $('start').textContent = tr('Writing questions…');
  try {
    qs = await build(topic, src, n, level);
    topicName = topic || tr('your page');
    i = 0; right = 0; missed = []; show('play'); renderQ();
  } catch (e) { $('serr').textContent = e.message; }
  $('start').disabled = false; $('start').textContent = tr('Start quiz'); renderWeak();
}
$('start').onclick = () => {
  const topic = $('topic').value.trim(), src = $('src').value;
  if (!topic && !src) { $('serr').textContent = tr('Enter a topic or choose page / selection.'); return; }
  begin(topic, src, Math.min(15, Math.max(3, +$('n').value || 5)), $('level').value);
};
$('drill').onclick = () => {
  const w = Object.entries(weak).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 4).map(x => x[0]);
  begin(w.join('; '), '', 6, $('level').value);
};

function renderQ() {
  const q = qs[i];
  $('prog').textContent = tr('Question {0} of {1} · {2} correct', i + 1, qs.length, right);
  $('qtext').textContent = q.q;
  $('fb').classList.add('hide'); $('nextBtn').classList.add('hide');
  $('opts').innerHTML = q.options.map((o, k) => `<div class="row"><button class="ghost" data-k="${k}" style="text-align:left">${esc(o)}</button></div>`).join('');
  $('opts').querySelectorAll('button').forEach(b => b.onclick = () => answer(+b.dataset.k));
}
function answer(k) {
  const q = qs[i], ok = k === q.answer, tp = q.topic || topicName;
  if (ok) { right++; if (weak[tp]) { weak[tp]--; } } else { weak[tp] = (weak[tp] || 0) + 1; missed.push(q); }
  saveW();
  $('opts').querySelectorAll('button').forEach(b => {
    b.disabled = true;
    if (+b.dataset.k === q.answer) { b.style.background = 'var(--good)'; b.style.color = '#fff'; }
    else if (+b.dataset.k === k) { b.style.background = 'var(--bad)'; b.style.color = '#fff'; }
  });
  $('fb').classList.remove('hide');
  $('fb').innerHTML = (ok ? '✅ ' + tr('Correct.') + ' ' : '❌ ' + tr('Not quite.') + ' ') + esc(q.why || '');
  $('nextBtn').classList.remove('hide'); $('nextBtn').textContent = i + 1 < qs.length ? tr('Next') : tr('See results');
}
$('nextBtn').onclick = () => { i++; if (i < qs.length) renderQ(); else finish(); };
function finish() {
  show('done');
  $('score').textContent = `${right} / ${qs.length} (${Math.round(right / qs.length * 100)}%)`;
  $('review').innerHTML = missed.length ? '<p class="muted">' + tr('Review these:') + '</p>' + missed.map(q => `<div class="card">${esc(q.q)}<div class="muted">${esc(tr('Answer: {0}', q.options[q.answer]))}</div></div>`).join('') : '<p>' + tr('Perfect score! 🎉') + '</p>';
}
$('again').onclick = () => { show('setup'); renderWeak(); };
$('logit').onclick = () => insert(tr('Quiz on {0}: {1}/{2}', topicName, right, qs.length) + (missed.length ? '\n' + tr('Review:') + ' ' + [...new Set(missed.map(q => q.topic || q.q))].join(', ') : ''));
renderWeak();

})();
</script>
</body>
</html>
