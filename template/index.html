<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Colours come from the app (Material You, set as --an-* by advnotes.js); the fallbacks are the app's own palette. */
  :root {
    --bg: var(--an-background, #F5F2FA); --fg: var(--an-onSurface, #1C1B1F); --muted: var(--an-onSurfaceVariant, #49454F);
    --accent: var(--an-primary, #3557D6); --on-accent: var(--an-onPrimary, #FFFFFF);
    --tonal: var(--an-secondaryContainer, #E0E0F9); --on-tonal: var(--an-onSecondaryContainer, #1D192B);
    --field: var(--an-surfaceContainerHighest, #E3E1E9); --card: var(--an-surfaceContainerHigh, #E9E7EF);
    --line: var(--an-outlineVariant, #CAC4D0); --outline: var(--an-outline, #79747E);
    --good: var(--an-tertiary, #0F8B6F); --warn:#C98A00; --bad: var(--an-error, #B3261E);
  }
  [data-theme="dark"] {
    --bg: var(--an-background, #1E1F25); --fg: var(--an-onSurface, #E6E1E5); --muted: var(--an-onSurfaceVariant, #CAC4D0);
    --accent: var(--an-primary, #B8C4FF); --on-accent: var(--an-onPrimary, #1B2C70);
    --tonal: var(--an-secondaryContainer, #444659); --on-tonal: var(--an-onSecondaryContainer, #E8DEF8);
    --field: var(--an-surfaceContainerHighest, #34343A); --card: var(--an-surfaceContainerHigh, #292A2F);
    --line: var(--an-outlineVariant, #49454F); --outline: var(--an-outline, #938F99);
    --good: var(--an-tertiary, #7FD8BF); --warn:#F0C050; --bad: var(--an-error, #F2B8B5);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 Roboto, system-ui, sans-serif; max-width:560px; margin-inline:auto; accent-color:var(--accent); }
  h2 { font-size:16px; font-weight:600; margin:0 0 10px; }
  input, select, textarea, button { font:inherit; color:var(--fg); }
  input, select, textarea { width:100%; padding:12px 14px; border-radius:12px; border:1px solid transparent; background:var(--field); outline:none; }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); }
  input[type=checkbox], input[type=radio] { width:18px; height:18px; padding:0; }
  input[type=range] { background:none; padding:0; border:0; }
  ::placeholder { color:var(--muted); opacity:.8; }
  textarea { resize:vertical; min-height:84px; }
  button { min-height:40px; padding:8px 20px; border:0; border-radius:20px; background:var(--accent); color:var(--on-accent);
           font-size:14px; font-weight:600; letter-spacing:.1px; cursor:pointer; transition:filter .15s, opacity .15s; }
  button:active { filter:brightness(.92); }
  button.ghost { background:var(--tonal); color:var(--on-tonal); }
  button:disabled { opacity:.38; cursor:default; }
  .row { display:flex; gap:8px; margin:8px 0; align-items:center; }
  .row > * { flex:1; min-width:0; }
  .row > .fit { flex:0 0 auto; }
  .row button.fit { padding:6px 14px; min-height:32px; border-radius:8px; }
  .tabs { display:flex; margin-bottom:14px; border:1px solid var(--outline); border-radius:20px; overflow:hidden; }
  .tabs button { flex:1; border-radius:0; background:transparent; color:var(--fg); padding:8px 4px; min-height:40px; }
  .tabs button + button { border-left:1px solid var(--outline); }
  .tabs button.on { background:var(--tonal); color:var(--on-tonal); }
  .card { background:var(--card); border-radius:18px; padding:16px; margin:10px 0; }
  .card input, .card select, .card textarea { background:var(--bg); }
  .muted { color:var(--muted); font-size:14px; }
  .hide { display:none !important; }
  .err { color:var(--bad); font-size:14px; }
  .pre { white-space:pre-wrap; }
  .out { font-size: 24px; margin: 12px 0; }
</style>
</head>
<body>
  <div class="row"><input id="v" type="number" value="1" style="flex:1"><select id="u">
    <option value="1.609344|mi|km">mi → km</option>
    <option value="0.0254|in|m">in → m</option>
    <option value="0.45359237|lb|kg">lb → kg</option>
  </select></div>
  <div class="out" id="out"></div>
  <button id="insert">Write on page</button>
  <button id="explain">Ask AI to explain</button>
  <p id="ai" style="color:var(--muted)"></p>
<script>
  // window.AdvNotes is injected by the app (see docs/TOOLS.md).
  const $ = id => document.getElementById(id);
  function result() {
    const [f, a, b] = $('u').value.split('|');
    const v = parseFloat($('v').value || '0');
    return `${v} ${a} = ${+(v * f).toPrecision(6)} ${b}`;
  }
  function update() { $('out').textContent = result(); AdvNotes.storage.set('last', $('v').value); }
  $('v').value = AdvNotes.storage.get('last') || '1';
  $('v').oninput = $('u').onchange = update;
  $('insert').onclick = () => AdvNotes.insertText(result());
  $('explain').onclick = async () => {
    $('ai').textContent = '…';
    try {
      await AdvNotes.ask('Explain this conversion briefly: ' + result(), { onText: t => $('ai').textContent = t });
    } catch (e) { $('ai').textContent = e.message; }
  };
  update();
</script>
</body>
</html>
